<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="930" viewBox="0 0 1100 930" font-family="DejaVu Sans, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="pt" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#333"/></marker></defs><rect x="430" y="16" width="240" height="44" rx="9" fill="#eef2f8" stroke="#1f3a5f" stroke-width="2"/>
<text x="550.0" y="40" text-anchor="middle" font-size="15" fill="#1a1a1a">pessoaId</text><path d="M550,60 L550,88" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><rect x="270" y="88" width="560" height="66" rx="9" fill="#eef7f4" stroke="#2e7d6b" stroke-width="2"/>
<text x="550.0" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d6b">Obter a pessoa e calcular a idade</text>
<text x="550.0" y="134" text-anchor="middle" font-size="13.5" fill="#1a1a1a">idade em anos completos no dia civil de São Paulo → faixa etária</text><path d="M550,154 L550,182" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><rect x="27" y="182" width="330" height="92" rx="9" fill="#fbf2e8" stroke="#b5651d" stroke-width="2"/>
<text x="192.0" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#b5651d">Carteira da pessoa</text>
<text x="192.0" y="228" text-anchor="middle" font-size="13.5" fill="#1a1a1a">registros e doses</text>
<text x="192.0" y="247" text-anchor="middle" font-size="13.5" fill="#1a1a1a">com data de aplicação</text><path d="M192,274 L192,296" stroke="#333" stroke-width="2" fill="none"/><rect x="385" y="182" width="330" height="92" rx="9" fill="#f4eef8" stroke="#7a4fa0" stroke-width="2"/>
<text x="550.0" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4fa0">Grupos especiais</text>
<text x="550.0" y="228" text-anchor="middle" font-size="13.5" fill="#1a1a1a">gestante, idoso etc.</text>
<text x="550.0" y="247" text-anchor="middle" font-size="13.5" fill="#1a1a1a">(com o início da gestação)</text><path d="M550,274 L550,296" stroke="#333" stroke-width="2" fill="none"/><rect x="743" y="182" width="330" height="92" rx="9" fill="#f1f3f6" stroke="#6b7a8f" stroke-width="2"/>
<text x="908.0" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b7a8f">Esquema vacinal 2026</text>
<text x="908.0" y="228" text-anchor="middle" font-size="13.5" fill="#1a1a1a">doses, idades e intervalos</text>
<text x="908.0" y="247" text-anchor="middle" font-size="13.5" fill="#1a1a1a">por grupo; campanhas ativas</text><path d="M908,274 L908,296" stroke="#333" stroke-width="2" fill="none"/><path d="M192,296 L908,296" stroke="#333" stroke-width="2" fill="none"/><path d="M550,296 L550,322" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><rect x="100" y="322" width="900" height="352" rx="12" fill="#fffaf0" stroke="#c9a227" stroke-width="2"/><text x="550" y="350" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d0b">calcularProximasDoses (função pura)</text><rect x="130" y="368" width="840" height="62" rx="8" fill="#fff" stroke="#c9a227" stroke-width="1.4"/><circle cx="162" cy="399" r="14" fill="#c9a227"/><text x="162" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text><text x="190" y="394" font-size="13.5" fill="#1a1a1a">Filtrar as doses que valem para a pessoa: idade e janela de idade,</text><text x="190" y="413" font-size="13.5" fill="#1a1a1a">grupo especial (regras da gestante; vacinas vivas fora do esquema)</text><path d="M550,430 L550,442" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><rect x="130" y="442" width="840" height="62" rx="8" fill="#fff" stroke="#c9a227" stroke-width="1.4"/><circle cx="162" cy="473" r="14" fill="#c9a227"/><text x="162" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text><text x="190" y="468" font-size="13.5" fill="#1a1a1a">Em cada vacina, achar a próxima dose ainda não cumprida</text><text x="190" y="487" font-size="13.5" fill="#1a1a1a">(equivalências entre vacinas; doses &quot;a cada gestação&quot;)</text><path d="M550,504 L550,516" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><rect x="130" y="516" width="840" height="62" rx="8" fill="#fff" stroke="#c9a227" stroke-width="1.4"/><circle cx="162" cy="547" r="14" fill="#c9a227"/><text x="162" y="552" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text><text x="190" y="542" font-size="13.5" fill="#1a1a1a">data prevista = maior entre (nascimento + idade recomendada)</text><text x="190" y="561" font-size="13.5" fill="#1a1a1a">e (data da última dose + intervalo mínimo)</text><path d="M550,578 L550,590" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><rect x="130" y="590" width="840" height="62" rx="8" fill="#fff" stroke="#c9a227" stroke-width="1.4"/><circle cx="162" cy="621" r="14" fill="#c9a227"/><text x="162" y="626" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text><text x="190" y="616" font-size="13.5" fill="#1a1a1a">Classificar: ATRASADA · DISPONÍVEL (sem data) ·</text><text x="190" y="635" font-size="13.5" fill="#1a1a1a">PRÓXIMA (vence em até 30 dias) · FUTURA</text><path d="M192,674 L192,706" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><rect x="27" y="706" width="330" height="82" rx="9" fill="#fbeeec" stroke="#c0392b" stroke-width="2"/>
<text x="192.0" y="730" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Pendentes</text>
<text x="192.0" y="752" text-anchor="middle" font-size="13.5" fill="#1a1a1a">ATRASADA + DISPONÍVEL</text>
<text x="192.0" y="771" text-anchor="middle" font-size="13.5" fill="#1a1a1a">(faltam doses)</text><path d="M192,788 L192,818" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><path d="M550,674 L550,706" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><rect x="385" y="706" width="330" height="82" rx="9" fill="#fbf2e8" stroke="#b5651d" stroke-width="2"/>
<text x="550.0" y="730" text-anchor="middle" font-size="15" font-weight="bold" fill="#b5651d">Próximas doses</text>
<text x="550.0" y="752" text-anchor="middle" font-size="13.5" fill="#1a1a1a">PRÓXIMA + FUTURA</text>
<text x="550.0" y="771" text-anchor="middle" font-size="13.5" fill="#1a1a1a">com data prevista</text><path d="M550,788 L550,818" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><path d="M908,674 L908,706" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><rect x="743" y="706" width="330" height="82" rx="9" fill="#eef7f4" stroke="#2e7d6b" stroke-width="2"/>
<text x="908.0" y="730" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d6b">Em dia</text>
<text x="908.0" y="752" text-anchor="middle" font-size="13.5" fill="#1a1a1a">vacinas sem dose</text>
<text x="908.0" y="771" text-anchor="middle" font-size="13.5" fill="#1a1a1a">pendente</text><path d="M908,788 L908,818" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><rect x="60" y="818" width="980" height="92" rx="9" fill="#eef2f8" stroke="#1f3a5f" stroke-width="2"/>
<text x="550.0" y="842" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f3a5f">Resposta da API</text>
<text x="550.0" y="864" text-anchor="middle" font-size="13.5" fill="#1a1a1a">GET /pendencias/:pessoaId  →  { pessoa, faixa_etaria, idade, em_dia[], pendentes[] }</text>
<text x="550.0" y="883" text-anchor="middle" font-size="13.5" fill="#1a1a1a">GET /pendencias/:pessoaId/proximas-doses  →  próximas doses com data prevista e status</text></svg>