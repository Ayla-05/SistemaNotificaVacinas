<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="700" viewBox="0 0 1310 700" font-family="DejaVu Sans, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ponta" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#333"/></marker><marker id="ponta-i" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#333"/></marker></defs><rect x="30" y="70" width="250" height="160" rx="10" fill="#eef7f4" stroke="#2e7d6b" stroke-width="2"/>
