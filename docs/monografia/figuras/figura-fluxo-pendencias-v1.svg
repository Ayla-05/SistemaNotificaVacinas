<text x="857.5" y="54" text-anchor="middle" font-size="14" fill="#1a1a1a">obterFaixaEtaria(idade)</text><path d="M857,80 L857,130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><path d="M160,80 L160,130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><rect x="60" y="130" width="330" height="90" rx="9" fill="#fbf2e8" stroke="#b5651d" stroke-width="2"/>
