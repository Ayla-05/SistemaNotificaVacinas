<text x="750.0" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4fa0">Calendário da faixa etária</text>
<text x="750.0" y="176" text-anchor="middle" font-size="13.5" fill="#1a1a1a">(vacina, doses exigidas)</text><path d="M225,220 L225,262" stroke="#333" stroke-width="2" fill="none"/><path d="M750,220 L750,262" stroke="#333" stroke-width="2" fill="none"/><path d="M225,262 L750,262" stroke="#333" stroke-width="2" fill="none"/><path d="M488,262 L488,292" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><rect x="90" y="292" width="800" height="300" rx="12" fill="#fffaf0" stroke="#c9a227" stroke-width="2"/><text x="490" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d0b">para cada vacina do calendário</text><rect x="130" y="346" width="720" height="64" rx="8" fill="#fff" stroke="#c0392b" stroke-width="1.6"/><text x="160" y="384" font-size="15" font-weight="bold" fill="#1a1a1a">sem registro</text><path d="M370,378 L420,378" stroke="#333" stroke-width="2" marker-end="url(#pt)"/><text x="435" y="384" font-size="15" fill="#c0392b" font-weight="bold">pendente (faltam = doses exigidas)</text><rect x="130" y="422" width="720" height="64" rx="8" fill="#fff" stroke="#c0392b" stroke-width="1.6"/><text x="160" y="460" font-size="15" font-weight="bold" fill="#1a1a1a">maior dose &lt; exigidas</text><path d="M370,454 L420,454" stroke="#333" stroke-width="2" marker-end="url(#pt)"/><text x="435" y="460" font-size="15" fill="#c0392b" font-weight="bold">pendente (faltam = exigidas − maior dose)</text><rect x="130" y="498" width="720" height="64" rx="8" fill="#fff" stroke="#2e7d6b" stroke-width="1.6"/><text x="160" y="536" font-size="15" font-weight="bold" fill="#1a1a1a">maior dose ≥ exigidas</text><path d="M370,530 L420,530" stroke="#333" stroke-width="2" marker-end="url(#pt)"/><text x="435" y="536" font-size="15" fill="#2e7d6b" font-weight="bold">em dia</text><path d="M490,592 L490,640" stroke="#333" stroke-width="2" fill="none" marker-end="url(#pt)"/><rect x="160" y="640" width="660" height="80" rx="9" fill="#eef2f8" stroke="#1f3a5f" stroke-width